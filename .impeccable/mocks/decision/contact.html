<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1440px;height:900px;overflow:hidden;background:#161c1a;color:#e3e2da;font-family:"EB Garamond",serif}
.bar{display:flex;justify-content:space-between;align-items:baseline;padding:24px 32px}
.bar b{font:400 34px/1 "Bebas Neue"}.bar span{font-size:18px;margin-left:28px}
.wrap{display:grid;grid-template-columns:330px 1fr;gap:32px;padding:16px 32px}
aside h1{font:400 112px/.85 "Bebas Neue"}aside p{font-size:20px;margin-top:24px}
aside ol{list-style:none;margin-top:40px;font:400 40px/1.15 "Bebas Neue"}aside li.on{color:#9fc7b8}aside li{color:#8e948d}
.sheet{background:#1f2725;padding:28px 26px;height:780px}
.sheet h2{font:400 22px/1 "Bebas Neue";display:flex;justify-content:space-between;margin-bottom:16px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#0f1312;padding:18px 10px;margin-bottom:12px}
.strip img,.strip div{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#2a3431}
.strip p{grid-column:1/-1;font-size:14px;color:#8e948d}
</style></head><body>
